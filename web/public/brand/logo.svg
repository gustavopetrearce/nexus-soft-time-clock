<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Logotipo PROVISIONAL (IDENT/03): reloj índigo. Si cambia la marca, solo se sustituye este archivo.
       Los colores llegan por CSS desde la página (tokens --nx-*) a través de <use>. -->
  <symbol id="iso" viewBox="0 0 64 64">
    <rect style="fill:var(--nx-color-indigo-500)" width="64" height="64" rx="16"/>
    <circle style="stroke:var(--nx-color-white)" cx="32" cy="32" r="18" fill="none" stroke-width="3.5"/>
    <path style="stroke:var(--nx-color-white)" d="M32 22v11l7 5" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <use href="#iso"/>
</svg>
