name: nexus_time_clock
description: "Nexus Soft Time Clock — App de empleados (offline-first)."
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Red. La serialización se escribe a mano: el único codegen del módulo es Drift.
  dio: ^5.7.0

  # Persistencia local (offline-first) — Drift/SQLite
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Seguridad y dispositivo
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  device_info_plus: ^10.1.2

  # Ubicación y captura
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  mobile_scanner: ^5.2.3
  # Evidencia fotográfica (RF-18). image_picker delega en la cámara del sistema: no requiere
  # gestionar el ciclo de vida de la cámara ni permisos adicionales a los ya declarados.
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  crypto: ^3.0.5

  # Firebase (mensajería, crashlytics, analytics)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  uuid: ^4.5.1
  intl: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  # Usado por el test de migración de esquema para preparar una base con el esquema anterior.
  # Mantener en 2.x: subirlo arrastra drift >=2.32, que exige sqlite3_flutter_libs 0.6 y con
  # ello un cambio en la capa nativa de SQLite. Es lo que hoy limita `analyzer` a la 10.x.
  sqlite3: ^2.4.0
  drift_dev: ^2.20.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true   # habilita gen-l10n (i18n)

# Iconos de launcher (marca del reloj índigo, consistente con la web).
# Fuentes en assets/icon/. Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/ic_launcher_full.png"
  adaptive_icon_background: "assets/icon/ic_launcher_bg.png"
  adaptive_icon_foreground: "assets/icon/ic_launcher_fg.png"
  min_sdk_android: 23
