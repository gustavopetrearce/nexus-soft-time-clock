plugins {
    id "com.android.application"
    id "kotlin-android"
    // El plugin de Flutter debe aplicarse después de los de Android/Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
    // Para habilitar Firebase (Messaging/Crashlytics/Analytics), añade google-services.json
    // en android/app/ y descomenta la línea siguiente (+ la de settings.gradle):
    // id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

// Versionado: la única fuente de verdad es el `version:` de pubspec.yaml.
//
// `flutter build` lo vuelca en local.properties antes de invocar a Gradle, y por el
// camino aplica --build-name/--build-version si se pasaron; por eso local.properties
// tiene prioridad. Pero está fuera de VCS, así que un `gradlew bundleRelease` directo
// —en CI o en una máquina recién clonada— no lo encuentra. Ese caso degradaba en
// silencio a versionCode 1 y producía un bundle mal versionado; ahora se cae de vuelta
// al pubspec y, si tampoco se puede leer, el build falla en lugar de mentir.
def pubspecVersion = null
def pubspecFile = rootProject.file("../pubspec.yaml")
if (pubspecFile.exists()) {
    def versionLine = pubspecFile.readLines().find { it ==~ /^version:\s*\S+.*/ }
    if (versionLine != null) {
        pubspecVersion = versionLine.replaceFirst(/^version:\s*/, "").trim()
    }
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
        ?: pubspecVersion?.split("\\+")?.first()
if (flutterVersionName == null) {
    throw new GradleException("No se puede determinar el versionName: falta " +
            "flutter.versionName en android/local.properties y `version:` en pubspec.yaml.")
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
        ?: (pubspecVersion?.contains("+") ? pubspecVersion.split("\\+").last() : null)
if (flutterVersionCode == null) {
    throw new GradleException("No se puede determinar el versionCode: falta " +
            "flutter.versionCode en android/local.properties y el sufijo `+N` de " +
            "`version:` en pubspec.yaml.")
}

// Carga la configuración de firma de release desde key.properties (fuera de VCS).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.condor.nexussoft.timeclock"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    defaultConfig {
        applicationId = "com.condor.nexussoft.timeclock"
        // minSdk 23: requerido por biometría (BiometricPrompt), Firebase y mobile_scanner.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Firma de release con la upload key definida en key.properties.
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

// mobile_scanner 5.2.3 fija ML Kit 17.2.0 y CameraX 1.3.3, cuyas bibliotecas nativas
// (libbarhopper_v3.so, libimage_processing_util_jni.so) están alineadas a 4 KB y hacen
// que Play rechace el bundle por no admitir páginas de memoria de 16 KB. Se elevan aquí
// a las primeras versiones alineadas a 16 KB.
// Retirar este bloque cuando se migre a mobile_scanner >= 7.x, que ya las trae.
dependencies {
    constraints {
        implementation("com.google.mlkit:barcode-scanning:17.3.0")
        implementation("androidx.camera:camera-core:1.4.2")
        implementation("androidx.camera:camera-camera2:1.4.2")
        implementation("androidx.camera:camera-lifecycle:1.4.2")
    }
}
