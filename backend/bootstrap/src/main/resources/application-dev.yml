# Perfil de desarrollo. Se activa con SPRING_PROFILES_ACTIVE=dev
# Apunta a los servicios del docker-compose de infra/.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD:nexus}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}   # MailHog

# El stack local trae su propio Prometheus: sin credencial no habría métricas en Grafana.
# En producción esta variable es obligatoria (ver application.yml).
security:
  metrics:
    password: ${SECURITY_METRICS_PASSWORD:prometheus-dev}

logging:
  level:
    org.hibernate.SQL: DEBUG
