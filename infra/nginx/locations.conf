# =====================================================================
# Rutas del stack, compartidas por el servidor HTTP y el HTTPS.
# Se incluye desde ambos para que activar TLS no duplique —ni desincronice—
# la configuración delicada de /evidence/ y /ws.
# =====================================================================

# Portal Angular (PWA)
location / {
    proxy_pass http://web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API REST + OpenAPI
location ~ ^/(api|v3/api-docs|swagger-ui) {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Del actuator solo sale el health, que es lo que consultan los orquestadores y la
# monitorización externa. `^~` gana a la expresión regular de arriba.
location ^~ /actuator/health {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# El resto del actuator no se publica. /actuator/prometheus y /actuator/metrics exponen el
# volumen de marcaciones, la topología y la memoria del servidor; Prometheus los scrapea por
# la red interna del stack, con credencial (SECURITY_METRICS_PASSWORD), sin pasar por aquí.
location /actuator {
    return 404;
}

# Evidencias fotográficas (RF-18): passthrough a MinIO para que las URLs prefirmadas
# que emite el backend sean alcanzables desde el móvil y el portal.
#
# El bucket se llama "evidence" igual que este prefijo de ruta, así que NO hay rewrite:
# el path que firma el backend y el que recibe MinIO son idénticos. Cuidado al tocar esto,
# porque una firma SigV4 rota se manifiesta como un opaco "SignatureDoesNotMatch":
#   - $http_host (no $host): la firma incluye el puerto, y $host lo descarta.
#   - sin barra final en proxy_pass: la añadiría recortando el prefijo.
#   - sin limit_req de la zona "api": estrangularía las subidas junto con la API.
location /evidence/ {
    proxy_pass http://minio;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    # El default de client_max_body_size es 1 MB: una foto de evidencia daría 413.
    client_max_body_size 3m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# WebSocket (tiempo real, STOMP). La autorización va en la trama CONNECT, no aquí.
location /ws {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Un socket inactivo no es un socket muerto: sin esto nginx lo corta al minuto.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
