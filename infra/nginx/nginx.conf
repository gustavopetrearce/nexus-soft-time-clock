# =====================================================================
# NGINX — reverse proxy del stack.
# Enruta el portal (/), la API (/api, /swagger), el WebSocket (/ws) y las
# evidencias (/evidence) hacia sus servicios.
#
# El bloque `server` NO está aquí: lo escribe al arrancar
# /docker-entrypoint.d/40-tls.sh en conf.d/server.conf, eligiendo entre el
# servidor HTTP y el HTTPS según haya o no certificados montados. Las rutas
# viven una sola vez en locations.conf, que ambos incluyen.
# =====================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Oculta la versión exacta en la cabecera Server y en las páginas de error.
    server_tokens off;

    # Rate limiting perimetral (RNF-07).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream backend { server backend:8080; }
    upstream web     { server web:80; }
    upstream minio   { server minio:9000; }

    include /etc/nginx/conf.d/server.conf;
}
