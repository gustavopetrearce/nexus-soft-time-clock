# =====================================================================
# Servidor sin TLS. Se usa cuando no hay certificados montados: desarrollo,
# o un despliegue con la terminación TLS en un proxy por delante.
# =====================================================================
server {
    listen 80;
    server_name _;

    # Sin HSTS aquí a propósito: anunciarlo por HTTP plano no aporta y, si el
    # despliegue no llega a tener TLS, deja el dominio inaccesible en los
    # navegadores que ya lo hubieran memorizado.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La PRIMERA emisión del certificado ocurre necesariamente aquí, cuando todavía no hay
    # TLS: sin este location, certbot --webroot no podría validar el dominio y el stack nunca
    # llegaría a arrancar en modo HTTPS. Va antes del include para ganar a la ruta "/".
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/locations.conf;
}
