# =====================================================================
# Servidor con TLS (RNF-05, RN-42). Se usa cuando hay certificados montados.
# Las rutas de los certificados son marcadores que 40-tls.sh sustituye al arrancar
# (por eso no aparecen escritos en este comentario: el sed también los cambiaría).
# =====================================================================

# El 80 deja de servir la aplicación: solo redirige y atiende la renovación
# del certificado por HTTP-01, que por definición no puede ir por HTTPS.
server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # $host no lleva puerto: esta redirección apunta siempre al 443 estándar. Si publicas
    # HTTPS en otro puerto, entra directamente por él — el navegador que llegue al puerto
    # HTTP acabará en https://<dominio>/ y no encontrará nada escuchando.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;

    # Solo TLS 1.2/1.3: 1.0 y 1.1 llevan años retirados y son los que rompen RN-42.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Con TLS 1.3 la preferencia la marca el cliente; imponerla solo perjudica a los móviles.
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: un año. Los subdominios entran porque el stack sirve portal y API bajo el mismo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/locations.conf;
}
