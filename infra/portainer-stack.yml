# =====================================================================
# Stack de despliegue para Portainer — Nexus Soft Time Clock
# Servicios mínimos productivos: postgres + redis + backend + web + nginx.
#
# Dos formas de usarlo en Portainer:
#   A) Repository (build): Portainer clona el repo y construye las imágenes
#      con los Dockerfiles (secciones `build:` activas). Compose path:
#      infra/portainer-stack.yml
#   B) Registry (imágenes pre-construidas): comenta los bloques `build:` y
#      descomenta las líneas `image:` apuntando a tu registry.
#
# Todas las credenciales se inyectan por variables de entorno (pestaña
# "Environment variables" de Portainer o el .env del stack). Ver el manual:
# docs/iteracion-13-produccion/07-despliegue-portainer.md
# =====================================================================
name: nexus-time-clock

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus}
      POSTGRES_USER: ${DB_USER:-nexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [nexus]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexus} -d ${DB_NAME:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    networks: [nexus]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Evidencias fotográficas (RF-18, ADR-008). Sin `ports:` a propósito: solo se llega desde la
  # red interna y a través de NGINX (/evidence/), nunca directo desde internet.
  # MINIO_KMS_SECRET_KEY habilita el cifrado en reposo SSE-S3 (RNF-08); sin ella el bucket
  # queda sin cifrar y el backend lo avisa por log al arrancar.
  # El origen es quay.io, el registro propio de MinIO, y NO Docker Hub: MinIO archivó su edición
  # comunitaria y borró `minio/minio` de Docker Hub, que desde entonces responde al pull con
  # "repository does not exist or may require 'docker login'" y rompe el redespliegue. No es un
  # problema de credenciales y ningún `docker login` lo arregla: no devolver el prefijo.
  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?falta MINIO_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
      MINIO_BROWSER: "off"
    volumes:
      - miniodata:/data
    networks: [nexus]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    # --- A) Build desde el repo (método Repository de Portainel) ---
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    # --- B) Imagen pre-construida en tu registry (comenta el bloque build) ---
    # image: ${REGISTRY:-registry.midominio.com}/nexus/backend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-nexus}
      DB_USER: ${DB_USER:-nexus}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      # Sin servidor SMTP en el stack: se desactiva el health de mail para
      # que /actuator/health no salga DOWN (liveness/readiness no lo incluyen).
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      SECURITY_QR_SECRET: ${SECURITY_QR_SECRET:?falta SECURITY_QR_SECRET}
      SECURITY_JWT_ACCESS_TTL_SECONDS: ${SECURITY_JWT_ACCESS_TTL_SECONDS:-900}
      SECURITY_JWT_REFRESH_TTL_DAYS: ${SECURITY_JWT_REFRESH_TTL_DAYS:-30}
      # Par RSA de firma del JWT (RS256). Sin estas vars el backend genera una llave
      # en memoria y TODOS los tokens se invalidan en cada reinicio/redeploy (el móvil
      # pierde acceso). Pega cada PEM en UNA sola línea con "\n" literales entre renglones;
      # el backend (RsaKeyConfig) los normaliza a saltos de línea reales.
      SECURITY_JWT_PRIVATE_KEY: ${SECURITY_JWT_PRIVATE_KEY:-}
      SECURITY_JWT_PUBLIC_KEY: ${SECURITY_JWT_PUBLIC_KEY:-}
      SECURITY_JWT_KEY_ID: ${SECURITY_JWT_KEY_ID:-nexus-rsa}
      # Evidencias (RF-18). El endpoint interno sirve para verificar los objetos; el PÚBLICO es
      # el que el cliente usará, y con el que hay que firmar: SigV4 firma el Host, así que si
      # aquí no va el origen real (el de NGINX), toda subida fallará con SignatureDoesNotMatch.
      STORAGE_MINIO_ENDPOINT: http://minio:9000
      STORAGE_MINIO_PUBLIC_ENDPOINT: ${PUBLIC_BASE_URL:?falta PUBLIC_BASE_URL}
      STORAGE_MINIO_BUCKET: ${STORAGE_MINIO_BUCKET:-evidence}
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?falta MINIO_PASSWORD}
      # Credencial del scrape de métricas. /actuator/prometheus ya no es público y NGINX
      # tampoco lo publica: sin esta variable el endpoint queda cerrado (y sin métricas).
      SECURITY_METRICS_USERNAME: ${SECURITY_METRICS_USERNAME:-prometheus}
      SECURITY_METRICS_PASSWORD: ${SECURITY_METRICS_PASSWORD:-}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    networks: [nexus]

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    # image: ${REGISTRY:-registry.midominio.com}/nexus/web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    networks: [nexus]

  nginx:
    # Config horneada en la imagen (evita bind-mount de ruta relativa, que
    # Portainer resuelve desde la raíz del repo y rompe el arranque).
    build:
      context: ..
      dockerfile: infra/nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
      - web
      - minio
    ports:
      - "${HTTP_PORT:-8081}:80"       # Redirige a HTTPS cuando hay certificados montados.
      # Punto de entrada con TLS (RNF-05, RN-42). El defecto es un puerto alto A PROPÓSITO:
      # si algo ya escucha en el 443 del host, NGINX no arranca y tumba el stack entero, y
      # eso ocurriría en el primer redespliegue sin que nadie lo haya pedido. Al activar TLS
      # de verdad hay que ponerlo en 443, porque la redirección desde HTTP se construye con
      # $host, que no lleva puerto.
      - "${HTTPS_PORT:-8443}:443"
    environment:
      # Rutas DENTRO del contenedor. Si ambas son legibles, el entrypoint levanta HTTPS y
      # el 80 pasa a redirigir; si no, sirve HTTP como hasta ahora y lo avisa por log.
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/etc/nginx/certs/fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/etc/nginx/certs/privkey.pem}
    volumes:
      # Certificados del host en solo lectura. El defecto es una ruta que NO existe, a
      # propósito: así el stack se queda en HTTP salvo que alguien monte certificados
      # deliberadamente. Apuntarlo por defecto a /etc/letsencrypt era peligroso — un host
      # donde otro proxy ya termina TLS tiene ahí certificados reales, y el stack se pondría
      # a competir por el 443 con quien ya lo sirve.
      # Para que ESTE stack termine TLS: TLS_CERTS_DIR=/etc/letsencrypt/live/<dominio>.
      - ${TLS_CERTS_DIR:-/etc/nexus/tls-certs}:/etc/nginx/certs:ro
      # Raíz del desafío HTTP-01, para renovar el certificado sin parar el stack.
      - ${CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
    networks: [nexus]

networks:
  nexus:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
