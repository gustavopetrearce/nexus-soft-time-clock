# Scrapea las métricas del backend expuestas por Spring Actuator (RNF-11).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nexus-backend'
    metrics_path: '/actuator/prometheus'
    # El endpoint dejó de ser público: expone volumen de marcaciones, topología y memoria.
    # Esta es la credencial del stack de desarrollo; en producción, donde Prometheus vive
    # fuera de este compose, usa `password_file` y no la contraseña en claro.
    basic_auth:
      username: 'prometheus'
      password: 'prometheus-dev'
    static_configs:
      - targets: ['backend:8080']
        labels:
          application: 'nexus-time-clock'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
