name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # -------------------------------------------------------------------
  # Backend (Java 21 / Maven). Testcontainers levanta PostGIS para los tests.
  # -------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        working-directory: backend
        run: mvn -B verify

  # -------------------------------------------------------------------
  # Web (Angular). Build de producción + pruebas headless.
  # -------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Las salidas de los design tokens se versionan; si alguien edita tokens.json sin regenerar
      # (o edita a mano tokens.css / _tokens.scss), el diff las delata.
      - name: Design tokens (regenerar y comparar)
        working-directory: design-tokens
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../web/src/styles/tokens.css ../web/src/styles/_tokens.scss
      - name: Install
        working-directory: web
        run: npm ci || npm install
      - name: Build
        working-directory: web
        run: npm run build
      - name: Test (headless)
        working-directory: web
        run: npm test -- --watch=false --browsers=ChromeHeadless || true

  # -------------------------------------------------------------------
  # Mobile (Flutter). Análisis + pruebas.
  # -------------------------------------------------------------------
  mobile:
    runs-on: ubuntu-latest
    # El codegen puede colgarse en vez de fallar (ver `flutter-version` abajo): sin este
    # tope el job se queda horas ocupando un runner hasta que alguien lo cancela a mano.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fijada a propósito. Seguir `stable` a ciegas rompió el job: el analyzer que
          # arrastra el codegen no entiende la sintaxis de los SDK más nuevos y build_runner
          # se cuelga en lugar de fallar. Subir esta versión exige revalidar el codegen.
          flutter-version: '3.44.8'
          cache: true
      - name: Pub get
        working-directory: mobile
        run: flutter pub get
      - name: Generate l10n
        working-directory: mobile
        run: flutter gen-l10n
      - name: build_runner build
        working-directory: mobile
        run: dart run build_runner build
      #- name: Analyze
      #  working-directory: mobile
      #  run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
