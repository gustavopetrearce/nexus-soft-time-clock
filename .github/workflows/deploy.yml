# =====================================================================
# Deploy — redespliega el stack en Portainer en cada push a main.
# Reutiliza scripts/redeploy.sh (autentica, git pull+redeploy, verifica).
#
# Portainer construye las imágenes en su host; el runner solo dispara la
# orden vía API, así que este job es ligero.
#
# Requiere estos SECRETS del repo (Settings → Secrets and variables → Actions):
#   PORTAINER_PASS        contraseña del usuario de Portainer
#   GH_PAT                Personal Access Token con acceso de lectura al repo
#                         (Portainer lo usa para clonar el repo privado)
#   DB_PASSWORD           debe COINCIDIR con la del stack ya desplegado
#   SECURITY_QR_SECRET    idem
#   MINIO_PASSWORD        idem — credencial del storage de evidencias
#   SECURITY_JWT_PRIVATE_KEY / SECURITY_JWT_PUBLIC_KEY
#                         par RSA de firma del JWT, copiado del stack en Portainer
# Opcional pero recomendado:
#   SECURITY_METRICS_PASSWORD  credencial del scrape de /actuator/prometheus. Sin ella el
#                         endpoint queda cerrado; la app funciona igual, pero no hay métricas.
# Opcionales: el secret MINIO_KMS_SECRET_KEY (cifrado en reposo del bucket) y las
# variables PORTAINER_URL, APP_URL, STACK_ID, etc. (solo si cambian).
# =====================================================================
name: Deploy

on:
  push:
    branches: [main]
    # No redesplegar por cambios que no afectan al stack productivo.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'mobile/**'
      - '.github/**'      # editar workflows no redespliega la app
      - '.gitignore'
      - '.editorconfig'
      - '.gitattributes'
      - 'scripts/.env.example'
  workflow_dispatch:
    inputs:
      pull_image:
        description: 'Forzar reconstrucción total de imágenes'
        type: boolean
        default: false
      verify:
        description: 'Verificar health/login tras el deploy'
        type: boolean
        default: true

# Evita redespliegues solapados (encola, no cancela el que está en curso).
concurrency:
  group: deploy-portainer
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    # Deja registro de despliegue en GitHub; puedes añadirle reglas de
    # protección/aprobación en Settings → Environments.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Redeploy stack en Portainer
        env:
          # Secretos (obligatorios) — el script aborta si falta alguno.
          PORTAINER_PASS: ${{ secrets.PORTAINER_PASS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECURITY_QR_SECRET: ${{ secrets.SECURITY_QR_SECRET }}
          # Par RSA de firma del JWT. Portainer reemplaza la env del stack en cada redeploy,
          # así que si no viajan aquí se pierden: el backend regenera la llave en memoria y
          # se invalidan todas las sesiones del móvil. Se pegan tal cual salen del PEM.
          SECURITY_JWT_PRIVATE_KEY: ${{ secrets.SECURITY_JWT_PRIVATE_KEY }}
          SECURITY_JWT_PUBLIC_KEY: ${{ secrets.SECURITY_JWT_PUBLIC_KEY }}
          # Credencial del storage de evidencias (RF-18). Sin ella el script aborta.
          MINIO_PASSWORD: ${{ secrets.MINIO_PASSWORD }}
          # Llave del KMS embebido de MinIO: habilita el cifrado en reposo del bucket (RNF-08).
          # Formato "nombre:base64", con la clave decodificando a 32 bytes exactos — pegar solo
          # la salida de `openssl rand -base64 32`, sin el prefijo, hace que MinIO no arranque y
          # tumba el stack completo (el script valida el formato antes de desplegar). Si se
          # omite, el bucket queda SIN cifrar y el backend lo avisa por log al arrancar.
          MINIO_KMS_SECRET_KEY: ${{ secrets.MINIO_KMS_SECRET_KEY }}
          # Credencial del scrape de /actuator/prometheus, que ya no es público. Si se deja
          # vacía el endpoint queda cerrado y la app funciona igual: se pierde la métrica.
          # Va como secret porque, como el resto, el redeploy REEMPLAZA la env del stack:
          # fijarla a mano en la UI de Portainer no sobrevive al siguiente despliegue.
          SECURITY_METRICS_PASSWORD: ${{ secrets.SECURITY_METRICS_PASSWORD }}
          # Overrides opcionales (si no se definen, el script usa sus defaults).
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          APP_URL: ${{ vars.APP_URL }}
          STACK_ID: ${{ vars.STACK_ID }}
          ENDPOINT_ID: ${{ vars.ENDPOINT_ID }}
          HTTP_PORT: ${{ vars.HTTP_PORT }}
          # TLS (RNF-05). Mientras no existan certificados en el host, NGINX sigue sirviendo
          # HTTP y estas tres no hacen falta. HTTPS_PORT por defecto es un puerto alto: pasarlo
          # a 443 solo cuando el certificado esté emitido y el 443 del host esté libre.
          HTTPS_PORT: ${{ vars.HTTPS_PORT }}
          TLS_CERTS_DIR: ${{ vars.TLS_CERTS_DIR }}
          CERTBOT_WEBROOT: ${{ vars.CERTBOT_WEBROOT }}
          SECURITY_METRICS_USERNAME: ${{ vars.SECURITY_METRICS_USERNAME }}
          MINIO_USER: ${{ vars.MINIO_USER }}
          STORAGE_MINIO_BUCKET: ${{ vars.STORAGE_MINIO_BUCKET }}
          # Origen público con el que se firman las URLs de subida. Por defecto el script toma
          # APP_URL; definirlo aquí solo hace falta si el stack se publica en otro dominio.
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          # En push automático no hay "inputs" (solo existen en workflow_dispatch): por
          # defecto forzamos reconstrucción, porque sin --pull-image Portainer recrea los
          # contenedores reutilizando la imagen ya construida y el código nuevo no llega
          # a producción aunque el job reporte éxito.
          FLAGS="--pull-image"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.pull_image }}" = "false" ]; then
            FLAGS=""
          fi
          if [ "${{ inputs.verify }}" = "false" ]; then FLAGS="$FLAGS --no-verify"; fi
          echo "Ejecutando: scripts/redeploy.sh$FLAGS"
          bash scripts/redeploy.sh $FLAGS
